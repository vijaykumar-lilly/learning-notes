[project]
name = "math-lesson-mcp-server"
version = "0.1.0"
description = "MCP server for creating mathematics lessons"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "jinja2>=3.1.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
math-lesson-server = "src.server:main"
